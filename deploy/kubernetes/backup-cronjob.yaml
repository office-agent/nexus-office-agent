apiVersion: batch/v1
kind: CronJob
metadata: { name: nexus-office-backup }
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 8
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 840
      template:
        spec:
          restartPolicy: Never
          securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: backup
              image: registry.example.com/nexus-office-operations:0.14.0
              args: ["dist/backup.mjs"]
              envFrom:
                - configMapRef: { name: nexus-office-config }
                - secretRef: { name: nexus-office-runtime }
              volumeMounts: [{ name: backup, mountPath: /var/lib/nexus-backups }]
              securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          volumes:
            - name: backup
              persistentVolumeClaim: { claimName: nexus-versioned-backups }
