apiVersion: batch/v1
kind: Job
metadata: { name: nexus-office-migrate-release }
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: registry.example.com/nexus-office-operations:0.14.0
          args: ["dist/migrate.mjs"]
          envFrom:
            - configMapRef: { name: nexus-office-config }
            - secretRef: { name: nexus-office-runtime }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
