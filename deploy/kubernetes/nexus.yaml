apiVersion: v1
kind: ServiceAccount
metadata: { name: nexus-office }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata: { name: nexus-office-config }
data:
  NODE_ENV: production
  NEXUS_ALLOW_DEMO_IDENTITY: "false"
  OPENAI_MODEL: gpt-5.6
  SECRET_PROVIDER: managed-http
  WAF_MODE: upstream
  RATE_LIMIT_MODE: upstream
  AUDIT_RETENTION_DAYS: "365"
  NEXUS_RELEASE_VERSION: 0.14.0
  REQUIRED_WORKER_ROLES: inbox,agent,outbox
  WORKER_LEASE_MS: "30000"
  WORKER_POLL_INTERVAL_MS: "500"
  WORKER_HEARTBEAT_INTERVAL_MS: "10000"
  WORKER_HEARTBEAT_MAX_AGE_MS: "45000"
  WORKER_MAX_ITEMS_PER_ROLE: "32"
  WORKER_MAX_CONCURRENT_PER_TENANT: "2"
  ENABLED_CONNECTORS: wecom
  WECOM_AGENT_ID: "10001"
  PUBLIC_APP_ORIGIN: https://office.example.com
  OIDC_ISSUER: https://idp.example.com
  OIDC_CLIENT_ID: nexus-office
  OIDC_REDIRECT_URI: https://office.example.com/api/v1/auth/callback
  SECRET_MANAGER_URL: https://secret-broker.platform.svc/resolve
  OTEL_EXPORTER_OTLP_ENDPOINT: https://otel-collector.platform.svc:4318
  BACKUP_TARGET_URI: file:///var/lib/nexus-backups
  BACKUP_ENCRYPTION_KEY_REF: secret://nexus/backup-encryption/current
  CLIENT_MIN_VERSION: 0.12.0
  CLIENT_MANAGED_DEVICE_REQUIRED: "true"
  CLIENT_OFFLINE_DRAFTS: disabled
  CLIENT_PUSH_ENABLED: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nexus-office }
spec:
  replicas: 3
  selector: { matchLabels: { app: nexus-office } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata: { labels: { app: nexus-office } }
    spec:
      serviceAccountName: nexus-office
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: registry.example.com/nexus-office:0.14.0
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: nexus-office-config }
            - secretRef: { name: nexus-office-runtime }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          livenessProbe: { httpGet: { path: /api/v1/health, port: http }, initialDelaySeconds: 20, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3 }
          readinessProbe: { httpGet: { path: /api/v1/ready, port: http }, initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 3 }
          startupProbe: { httpGet: { path: /api/v1/health, port: http }, periodSeconds: 5, failureThreshold: 24 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nexus-office-worker-inbox }
spec:
  replicas: 2
  selector: { matchLabels: { app: nexus-office-worker, role: inbox } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata: { labels: { app: nexus-office-worker, role: inbox } }
    spec:
      serviceAccountName: nexus-office
      terminationGracePeriodSeconds: 45
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: registry.example.com/nexus-office-worker:0.14.0
          env: [{ name: WORKER_ROLES, value: inbox }]
          envFrom:
            - configMapRef: { name: nexus-office-config }
            - secretRef: { name: nexus-office-runtime }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nexus-office-worker-agent }
spec:
  replicas: 2
  selector: { matchLabels: { app: nexus-office-worker, role: agent } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata: { labels: { app: nexus-office-worker, role: agent } }
    spec:
      serviceAccountName: nexus-office
      terminationGracePeriodSeconds: 45
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: registry.example.com/nexus-office-worker:0.14.0
          env: [{ name: WORKER_ROLES, value: agent }]
          envFrom:
            - configMapRef: { name: nexus-office-config }
            - secretRef: { name: nexus-office-runtime }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nexus-office-worker-outbox }
spec:
  replicas: 2
  selector: { matchLabels: { app: nexus-office-worker, role: outbox } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata: { labels: { app: nexus-office-worker, role: outbox } }
    spec:
      serviceAccountName: nexus-office
      terminationGracePeriodSeconds: 45
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: registry.example.com/nexus-office-worker:0.14.0
          env: [{ name: WORKER_ROLES, value: outbox }]
          envFrom:
            - configMapRef: { name: nexus-office-config }
            - secretRef: { name: nexus-office-runtime }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata: { name: nexus-office }
spec:
  selector: { app: nexus-office }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: nexus-office }
spec: { minAvailable: 2, selector: { matchLabels: { app: nexus-office } } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: nexus-office-worker-inbox }
spec: { minAvailable: 1, selector: { matchLabels: { app: nexus-office-worker, role: inbox } } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: nexus-office-worker-agent }
spec: { minAvailable: 1, selector: { matchLabels: { app: nexus-office-worker, role: agent } } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: nexus-office-worker-outbox }
spec: { minAvailable: 1, selector: { matchLabels: { app: nexus-office-worker, role: outbox } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: nexus-office }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: nexus-office }
  minReplicas: 3
  maxReplicas: 12
  behavior: { scaleDown: { stabilizationWindowSeconds: 300 } }
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: nexus-office-default-deny-ingress }
spec:
  podSelector: { matchLabels: { app: nexus-office } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { nexus-ingress: "true" } } }]
      ports: [{ protocol: TCP, port: 3000 }]
