apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-pi-runner
  labels:
    app.kubernetes.io/name: nexus-pi-runner
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nexus-pi-runner-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nexus-pi-runner
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-pi-runner
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus-pi-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus-pi-runner
    spec:
      serviceAccountName: nexus-pi-runner
      automountServiceAccountToken: false
      runtimeClassName: kata
      containers:
        - name: runner
          image: registry.internal.example/nexus/pi-runner:replace-me
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/pi-runner.mjs"]
          envFrom:
            - secretRef: { name: nexus-office-runtime }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: WORKER_ROLES
              value: pi-runner
            - name: NEXUS_RELEASE_VERSION
              value: 0.15.0-pi-runner-spike
            - name: NEXUS_PI_SANDBOX_PROVIDER
              value: kata
            - name: NEXUS_PI_NETWORK_POLICY
              value: none
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: runner-tmp
              mountPath: /tmp
      volumes:
        - name: runner-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
