apiVersion: v1
kind: ServiceAccount
metadata:
  name: nexus-pi-sandbox-supervisor
  labels:
    app.kubernetes.io/name: nexus-pi-sandbox-supervisor
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-pi-sandbox-state
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-pi-sandbox-rootfs
spec:
  accessModes: ["ReadOnlyMany"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-pi-sandbox-supervisor
  labels:
    app.kubernetes.io/name: nexus-pi-sandbox-supervisor
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nexus-pi-sandbox-supervisor
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nexus-pi-sandbox-supervisor-default-deny
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nexus-pi-sandbox-supervisor
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nexus-pi-runner
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: nexus-egress-proxy
      ports:
        - protocol: TCP
          port: 8443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-pi-sandbox-supervisor
  labels:
    app.kubernetes.io/name: nexus-pi-sandbox-supervisor
spec:
  # Keep disabled until a dedicated microVM node pool, KVM device plugin,
  # rootfs publisher, and egress proxy have passed G-027.
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus-pi-sandbox-supervisor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus-pi-sandbox-supervisor
    spec:
      serviceAccountName: nexus-pi-sandbox-supervisor
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1001
      nodeSelector:
        nexus.io/microvm-node: "true"
      tolerations:
        - key: nexus.io/microvm
          operator: Exists
          effect: NoSchedule
      containers:
        - name: supervisor
          image: registry.internal.example/nexus/pi-sandbox-supervisor:0.16.0-m23-e072
          imagePullPolicy: IfNotPresent
          command: ["node", "/app/pi-sandbox-supervisor.mjs"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: nexus-pi-sandbox-runtime
                optional: false
          env:
            - name: NEXUS_PI_SANDBOX_PROVIDER
              value: firecracker
            - name: NEXUS_PI_SANDBOX_SUPERVISOR_BACKEND
              value: firecracker
            - name: NEXUS_PI_SANDBOX_ROOTFS
              value: /var/lib/nexus/rootfs/rootfs.ext4
            - name: NEXUS_PI_SANDBOX_KERNEL_IMAGE
              value: /var/lib/nexus/rootfs/vmlinux
            - name: NEXUS_PI_SANDBOX_GUEST_AGENT_PORT
              value: "5000"
            - name: NEXUS_PI_SANDBOX_GUEST_CID
              value: "3"
            - name: NEXUS_PI_FIRECRACKER_PATH
              value: /usr/local/bin/firecracker
            - name: NEXUS_PI_SANDBOX_STATE_DIR
              value: /var/lib/nexus/state
            - name: NEXUS_PI_SANDBOX_SOCKET_DIRECTORY
              value: /run/nexus/pi-sandbox
            - name: NEXUS_PI_CGROUP_ROOT
              value: /sys/fs/cgroup/nexus-pi
            - name: NEXUS_PI_EGRESS_PROXY_ENDPOINT
              value: https://nexus-egress-proxy:8443
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_ADMIN", "SYS_ADMIN"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: kvm
              mountPath: /dev/kvm
            - name: firecracker-runtime
              mountPath: /usr/local/bin/firecracker
              readOnly: true
            - name: supervisor-state
              mountPath: /var/lib/nexus/state
            - name: rootfs
              mountPath: /var/lib/nexus/rootfs
              readOnly: true
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        - name: firecracker-runtime
          hostPath:
            path: /opt/nexus/bin/firecracker
            type: File
        - name: supervisor-state
          persistentVolumeClaim:
            claimName: nexus-pi-sandbox-state
        - name: rootfs
          persistentVolumeClaim:
            claimName: nexus-pi-sandbox-rootfs
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
