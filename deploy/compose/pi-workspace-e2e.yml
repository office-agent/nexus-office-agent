services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:10-rootless
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__server__ROOT_URL: "http://127.0.0.1:${PI_E2E_FORGEJO_PORT:-3001}/"
    ports:
      - "127.0.0.1:${PI_E2E_FORGEJO_PORT:-3001}:3000"
    volumes:
      - pi_e2e_forgejo_data:/var/lib/gitea
      - pi_e2e_forgejo_config:/etc/gitea
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${PI_E2E_MINIO_ROOT_USER:?set PI_E2E_MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${PI_E2E_MINIO_ROOT_PASSWORD:?set PI_E2E_MINIO_ROOT_PASSWORD}"
    ports:
      - "127.0.0.1:${PI_E2E_MINIO_PORT:-9002}:9000"
      - "127.0.0.1:${PI_E2E_MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - pi_e2e_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  pi_e2e_forgejo_data:
  pi_e2e_forgejo_config:
  pi_e2e_minio_data:
